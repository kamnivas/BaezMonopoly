<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="show_bucks">Baez Blocks: 10</p>
    <p id="show_suspicion">Suspicion: 0</p>
    <p id="show_time_interval">Time Interval: 0</p>
    <input type="button"
            name="TaxCitizenWon"
            id="taxcitizen_button_won"
            value="Tax Citizen! (Combat won)"
            onclick="tax_citizen(true)"
            >
    <input type="button"
        name="TaxCitizenLost"
        id="taxcitizen_button_lost"
        value="Tax Citizen! (Combat NOT won)"
        onclick="tax_citizen(false)"
        >
    <input type="button"
        name="TimeIntervalSimulator"
        id="interval_sim_button"
        value="Add To Interval"
        onclick="interval_sim()"
            >

    <script src="game_main.js"></script>
    <script>
        //Variables from game_main.js:
        let baez_bucks = Number(localStorage.getItem('baez_bucks') ?? 10);
        let suspicion = Number(localStorage.getItem('suspicion') ?? 0);
        let time_interval = Number(localStorage.getItem('time_interval') ?? 0);
        let game_over = (localStorage.getItem('game_over') === 'true');
        let internet_fee = Number(localStorage.getItem('internet_fee') ?? 1);
        function updateUIandSave() {
            document.getElementById("show_bucks").innerText = "Baez Blocks: "+baez_bucks;
            document.getElementById("show_suspicion").innerText = "Suspicion: "+suspicion;
            document.getElementById("show_time_interval").innerText = "Time Interval: "+time_interval;
            localStorage.setItem('baez_bucks', baez_bucks);
            localStorage.setItem('suspicion', suspicion);
            localStorage.setItem('internet_fee', internet_fee);
            localStorage.setItem('game_over', game_over);
            localStorage.setItem('time_interval', time_interval);
        }

        
        const base_num_lst = [1,1,1,2,2,2,3,3,4,4];
        bool_lst = ['Game Over','Reduction'];
        updateUIandSave(); 
        function interval_sim(){
            time_interval += 1
            updateUIandSave(); 
        }
        function tax_citizen(combat_won){
            let multiplier = (time_interval !== 0) ? time_interval : 1;
            let current_num_lst = base_num_lst.map(x => x * multiplier);
            let random_val = current_num_lst[Math.floor(Math.random() * current_num_lst.length)];
            if (suspicion <= 20){ //If there is not much suspicion, add baez blocks to the total and increase suspicion with an element of randomness
                baez_bucks += 10;
                suspicion += random_val;
            } else { //If there's suspicion, the user goes into combat
                if (combat_won === false){ //If combat is lost, the fate of the user is randomly decided between GameOver! or a baez_bucks reduction
                    let bool_rand = bool_lst[Math.floor(Math.random() * bool_lst.length)];
                    if (bool_rand === 'Game Over'){
                        game_over = true;
                        alert('Game Over!');
                    } else {
                        baez_bucks -= random_val;
                    }
                } else { //If combat is won, add baez_bucks and decrease suspicion
                    baez_bucks += 10;
                    suspicion -= random_val;
                }
            }
            updateUIandSave(); 
        }


       
    </script>
</body>
</html>
