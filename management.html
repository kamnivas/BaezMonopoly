<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="show_bucks">Baez Blocks: 10</p>
    <p id="show_suspicion">Suspicion: 0</p>
    <input type="button"
            name="TaxCitizen"
            id="taxcitizen_button"
            value="Tax Citizen! (Combat won)"
            onclick="tax_citizen(true)"
            >
    <input type="button"
        name="TaxCitizen"
        id="taxcitizen_button"
        value="Tax Citizen! (Combat NOT won)"
        onclick="tax_citizen(false)"
        >
    <input type="button"
        name="TimeIntervalSimulator"
        id="interval_sim_button"
        value="Add To Interval"
        onclick="interval_sim()"
            >

    <script src="game_main.js"></script>
    <script>
        //Variables from game_main.js:
            //suspicion variable (suspicion = 0)
            // baez blocks storage variable (baez_bucks = 10)
    
        num_lst = [1,1,1,2,2,2,3,3,4,4];
        bool_lst = ['Game Over','Reduction'];
        function interval_sim(){
            time_interval += 1
        }
        function tax_citizen(combat_won){
           
            if (time_interval !== 0){  //If the interval isn't 0, then multiply the num_lst by the interval (this ensures that the stakes are higher after each interval)
                num_lst = num_lst * time_interval;
            }
            if (suspicion <= 20){ //If there is not much suspicion, add baez blocks to the total and increase suspicion with an element of randomness
                baez_bucks += 10;
                suspicion += num_lst[Math.floor(Math.random() * num_lst.length)];
            } else { //If there's suspicion, the user goes into combat
                if (combat_won === false){ //If combat is lost, the fate of the user is randomly decided between GameOver! or a baez_bucks reduction
                    let bool_rand = bool_lst[Math.floor(Math.random() * bool_lst.length)];
                    if (bool_rand === 'Game Over'){
                        game_over = true;
                        alert('Game Over!');
                    } else {
                        baez_bucks -= num_lst[Math.floor(Math.random() * num_lst.length)];
                    }
                } else { //If combat is won, add baez_bucks and decrease suspicion
                    baez_bucks += 10;
                    suspicion -= num_lst[Math.floor(Math.random() * num_lst.length)];
                }
            }
            document.getElementById("show_bucks").innerText = "Baez Blocks: "+ String(baez_bucks); //display the number of baez_bucks
            document.getElementById("show_suspicion").innerText = "Suspicion: "+ String(suspicion); //display the suspicion count
        }
       
    </script>
</body>
</html>
