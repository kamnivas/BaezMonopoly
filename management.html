<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="show_bucks"></p>
    <input type="button"
            name="TaxCitizen"
            id="taxcitizen_button"
            value="Tax Citizen!"
            onclick="tax_citizen()"
            >

    <script src="game_main.js"></script>
    <script>
        //suspicion variable (suspicion = 0)
        // baez blocks storage variable (baez_bucks = 10)
        //Every time the user taxes someone, they get a random number chosen from the list [1,2,4,5,8,10] added to their suspicion score

        //When taxing, if suspicion <= 20 (NPC is NOT suspicious):
            //Move on to tax the next person
        //When taxing, if suspicion > 20 (NPC is suspicious)
            //Combat (Rock-Paper-Scissors format)
                //If user loses the combat:
                    //Randomly choose b/w (Game Over) OR ((baez_bucks) -= (random number chosen from [4,5,6,7,8,9,10]))
                //If user wins combat
                    //The user get +10 baez blocks to their total
                    // suspicion -= (a random number chosen from the following list: [0,5,10,15,20])
        num_lst1 = [1,2,4,5,8,10];
        num_lst2 = [4,5,6,7,8,9,10];
        num_lst3 = [0,5,10,15,20];
        bool_lst = ['Game Over','Reduction'];
        function tax_citizen(combat_won){
            if (suspicion <= 20){
                baez_bucks += 10;
                suspicion += num_lst1[Math.floor(Math.random() * num_lst1.length)];
            } else {
                if (combat_won === false){
                    let bool_rand = bool_lst[Math.floor(Math.random() * bool_lst.length)];
                    if (bool_rand === 'Game Over'){
                        game_over = true;
                        alert('Game Over!');
                    } else {
                        baez_bucks -= num_lst2[Math.floor(Math.random() * num_lst2.length)];
                    }
                } else {
                    baez_bucks += 10;
                    suspicion -= num_lst3[Math.floor(Math.random() * num_lst3.length)];
                }
            }
            document.getElementById("show_bucks").innerText = "Baez Blocks: "+ String(baez_bucks);
        }
       
    </script>
</body>
</html>
