<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <style>
        body {
            background-image: url("assets/background-1.png");
            background-repeat: repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-size: 200%;
        }

        #character {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
        }
        #shark {
            position: absolute;
            width: 48px;
            height: 48px;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <img id="character" src="assets/player-sprite.png" alt="Player Character">
    <img id="shark" src="assets/shark-map.png" alt="Shark">

    <script>
        let mapX = 0;
        let mapY = 0;
        const speed = 10;

        const pondX = 200; const pondY = 150;
        const shark = document.getElementById("shark");
        
        function updatePosition() {
            const screenX = (window.innerWidth / 2) + pondX + mapX;
            const screenY = (window.innerHeight / 2) + pondY + mapY;
            shark.style.left = screenX + "px";
            shark.style.top = screenY + "px";
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowRight" || event.key === "d") {
                mapX -= speed;
            } else if (event.key === "ArrowLeft" || event.key === "a") {
                mapX += speed;
            } else if (event.key === "ArrowDown" || event.key === "s") {
                mapY -= speed;
            } else if (event.key === "ArrowUp" || event.key === "w") {
                mapY += speed;
            }
            document.body.style.backgroundPosition = mapX + "px " + mapY + "px";
            updatePosition()
        });
    </script>

</body>
</html>
