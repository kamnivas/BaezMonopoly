<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <style>
        body {
            background-image: url("assets/background-1.png");
            background-repeat: repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-size: 200%;
        }

        #character {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
        }
        #shark {
            position: absolute;
            width: 48px;
            height: 48px;
            pointer-events: none;
        }
        #interact {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform:
            translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 16px;
            display: none;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <img id="character" src="assets/player-sprite.png" alt="Player Character">
    <img id="shark" src="assets/shark-map.png" alt="Shark">
    <div id="interact">F to enter combat</div>

    <script>
        let mapX = 0;
        let mapY = 0;
        const speed = 10;
        let canEnterCombat = false;

        const pondX = 200; const pondY = 150;
        const shark = document.getElementById("shark");
        
        function updatePosition() {
            const screenX = (window.innerWidth / 2) + pondX + mapX;
            const screenY = (window.innerHeight / 2) + pondY + mapY;
            shark.style.left = screenX + "px";
            shark.style.top = screenY + "px";
        }
            
        function updateUI() {
            const dialogueBox = document.getElementById("interact");
            const playerRect = character.getBoundingClientRect();
            const sharkRect = shark.getBoundingClientRect();

            // Colision detection
            const isColliding = (
            playerRect.left < sharkRect.right &&
            playerRect.right > sharkRect.left &&
            playerRect.top < sharkRect.bottom &&
            playerRect.bottom > sharkRect.top
            ); 

            // Ensure you can only enter combat when in range of the enemy
            if (isColliding) {
                canEnterCombat = true; dialogueBox.style.display = "block";
            }
            else {
                canEnterCombat = false; dialogueBox.style.display = "none";
            }
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowRight" || event.key === "d") {
                mapX -= speed;
            } else if (event.key === "ArrowLeft" || event.key === "a") {
                mapX += speed;
            } else if (event.key === "ArrowDown" || event.key === "s") {
                mapY -= speed;
            } else if (event.key === "ArrowUp" || event.key === "w") {
                mapY += speed;
            }

            if ((event.key === "f" || event.key === "F") && canEnterCombat) {
                console.log("Entering combat!");
                window.location.href = "combat.html";
            }
            document.body.style.backgroundPosition = mapX + "px " + mapY + "px";
            updatePosition();
            updateUI();
        });
    </script>

</body>
</html>
