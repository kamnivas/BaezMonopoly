<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <style>
        body {
            background-image: url("assets/background-1.png");
            background-repeat: repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-size: 200%;
        }

        #character {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
        }
        #shark {
            position: absolute;
            width: 48px;
            height: 48px;
            pointer-events: none;
        }
        #interact {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 16px;
            display: none;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <img id="character" src="assets/player-sprite.png" alt="Player Character">
    <img id="shark" src="assets/shark-map.png" alt="Shark">
    <div id="interact">F: Talk</div>

    <script>
        let mapX = 0;
        let mapY = 0;
        // Speed adjusted for frame-by-frame animation loop updates
        const speed = 5; 
        let canEnterCombat = false;

        const pondX = 200; 
        const pondY = 150;

        // Retrieve element references from the DOM
        const character = document.getElementById("character");
        const shark = document.getElementById("shark");
        const dialogueBox = document.getElementById("interact");

        // Object tracking currently held keys
        const keysPressed = {};

        // Track key presses
        document.addEventListener("keydown", (event) => {
            keysPressed[event.key] = true;

            // Combat redirect when pressing F inside range
            if ((event.key === "f" || event.key === "F") && canEnterCombat) {
                window.location.href = "combat.html";
            }
        });

        // Track key releases
        document.addEventListener("keyup", (event) => {
            keysPressed[event.key] = false;
        });

        function updateMovement() {
            // Evaluate active keys using if statements and logical OR operators
            if (keysPressed["ArrowRight"] || keysPressed["d"] || keysPressed["D"]) {
                mapX -= speed;
            }
            if (keysPressed["ArrowLeft"] || keysPressed["a"] || keysPressed["A"]) {
                mapX += speed;
            }
            if (keysPressed["ArrowDown"] || keysPressed["s"] || keysPressed["S"]) {
                mapY -= speed;
            }
            if (keysPressed["ArrowUp"] || keysPressed["w"] || keysPressed["W"]) {
                mapY += speed;
            }

            document.body.style.backgroundPosition = mapX + "px " + mapY + "px";
        }
        
        function updatePosition() {
            const screenX = (window.innerWidth / 2) + pondX + mapX;
            const screenY = (window.innerHeight / 2) + pondY + mapY;
            shark.style.left = screenX + "px";
            shark.style.top = screenY + "px";
        }
            
        function updateUI() {
            const playerRect = character.getBoundingClientRect();
            const sharkRect = shark.getBoundingClientRect();

            // Collision detection checking overlapping bounds
            const isColliding = (
                playerRect.left < sharkRect.right &&
                playerRect.right > sharkRect.left &&
                playerRect.top < sharkRect.bottom &&
                playerRect.bottom > sharkRect.top
            ); 

            // Show or hide dialogue box based on collision state
            if (isColliding) {
                canEnterCombat = true; 
                dialogueBox.style.display = "block";
            } else {
                canEnterCombat = false; 
                dialogueBox.style.display = "none";
            }
        }

        // Continuous game loop
        function gameLoop() {
            updateMovement();
            updatePosition();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        // Start the loop
        gameLoop();
    </script>
</body>
</html>
