<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="game_main.js" defer></script>
</head>
<body>
    <!-- Temporary UI -->
    <img src="assets/shark-combat.png" alt="">
    <p>Player HP: <span id="playerHP">100</span></p>
    <p>Enemy HP: <span id="cpuHP">100</span></p>

    <!-- Options for moves -->
    <button onclick="playRound('Heavy Attack')">Heavy Attack</button>
    <button onclick="playRound('Light Attack')">Light Attack</button>
    <button onclick="playRound('Block')">Block</button>
    <p id="result"></p>

    <script>
    let playerHP = 100;
    let cpuHP = 100;

    function playRound(playerMove) {
      const moves = ["Heavy Attack", "Light Attack", "Block"];
      
      let randomIndex = Math.floor(Math.random() * 3);
      let cpuMove = moves[randomIndex];
      
      let resultText = "You chose " + playerMove + ". CPU chose " + cpuMove + ".<br>";

     // If the moves are the same(draw)
    if (playerMove === "Heavy Attack" && cpuMove === "Heavy Attack") {
    resultText += "It is a draw. No damage taken.";
    } else if (playerMove === "Light Attack" && cpuMove === "Light Attack") {
    resultText += "It is a draw. No damage taken.";
    } else if (playerMove === "Block" && cpuMove === "Block") {
    resultText += "It is a draw. No damage taken.";

    // Player's attack is successful
    } else if (playerMove === "Heavy Attack" && cpuMove === "Block") {
    resultText += "Attack successful!";
    cpuHP -= 30;
    playerHP += 10;
    } else if (playerMove === "Light Attack" && cpuMove === "Heavy Attack") {
    resultText += "Attack successful!";
    cpuHP -= 30;
    playerHP += 10;
    } else if (playerMove === "Block" && cpuMove === "Light Attack") {
    resultText += "Attack successful!";
    cpuHP -= 30;
    playerHP += 10;

    // Player gets countered
    } else if (playerMove === "Heavy Attack" && cpuMove === "Light Attack") {
    resultText += "You were countered!";
    playerHP -= 30;
    } else if (playerMove === "Light Attack" && cpuMove === "Block") {
    resultText += "You were countered!";
    playerHP -= 30;
    } else if (playerMove === "Block" && cpuMove === "Heavy Attack") {
    resultText += "You were countered!";
    playerHP -= 30;
    }

        // When player or CPU get to 0 hp, game ends.
      if (playerHP <= 0 || cpuHP <= 0) {
        if (playerHP <= 0) {
          alert("Game Over! The CPU defeated you.");
          localStorage.setItem('game_over', true)
        } else {
          alert("Victory! You defeated the CPU.");
          localStorage.setItem('combat_won', true);
        }
        
        // Going back to main game
        window.location.href = "interactions.html";
      }

      // Display the results after any move
      document.getElementById("result").innerHTML = resultText;
      document.getElementById("playerHP").innerHTML = playerHP;
      document.getElementById("cpuHP").innerHTML = cpuHP;
    }
    </script>
</body>
</html>
